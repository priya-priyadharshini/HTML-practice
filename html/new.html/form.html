    <center>
    <header><strong ><font size="20">REGISTRATION FORM</font></strong><br><br>
<br    </header>
<hr>
<br>
<br>
    <center>
    <h2 id="registration">Registeration</h2>
    <form action="/submit" method="post">
        <table cellpadding="10">
            <tr>
                <td><b>Name:</b></td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td><b>Phone Number:</b></td>
                <td><input type="tel" placeholder="Enter your phone number"></td>
            </tr>

            <tr>
                <td><b>Email:</b></td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td><b>Date of Birth:</b></td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td><b>Address:</b></td>
                <td><textarea rows="4" cols="30" placeholder="Enter your address"></textarea></td>
            </tr>
            <tr>
                <td><b>College / University:</b></td>
                <td>
                    <select>
                        <option value="">Select your college/university</option>
                        <option value="srm">SRM</option>
                        <option value="sastra">SASTRA</option>
                        <option value="anna">ANNA</option>
                        <option value="mit">MIT</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Course:</b></td>
                <td>
                    <select>
                        <option value="" disabled selected>Select your course</option>
                        <option value="bca">BCA</option>
                        <option value="bcom">BCOM</option>
                        <option value="bsc">BSC</option>
                        <option value="ba">BA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                 <button type="submit"><a href=submit.htmlt</button>
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</center>
    </center>
</body>
</html>
